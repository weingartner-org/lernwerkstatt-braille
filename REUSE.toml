# Welche Datei steht unter welcher Lizenz (REUSE-Standard, reuse.software).
# Spätere Einträge gelten vor früheren.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Johannes Weingartner und Mitwirkende"
SPDX-License-Identifier = "EUPL-1.2"

[[annotations]]
path = ["**/*.md", "public/**/*.png", "public/**/*.svg", "public/**/*.pdf"]
precedence = "override"
SPDX-FileCopyrightText = "Johannes Weingartner und Mitwirkende"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "public/abzeichen/fluent/**"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation (Fluent Emoji)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["public/fonts/atkinson-*", "public/fonts/andika-*", "public/fonts/lexend-*", "public/fonts/opendyslexic-*", "public/fonts/inclusive-sans-*", "public/fonts/fredoka-*"]
precedence = "override"
SPDX-FileCopyrightText = "siehe public/fonts/SCHRIFTEN-LIZENZEN.md"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "public/fonts/luciole-*"
precedence = "override"
SPDX-FileCopyrightText = "Centre Technique Régional pour la Déficience Visuelle"
SPDX-License-Identifier = "CC-BY-4.0"

# Achtung: nicht kommerziell. Wer kommerziell nutzen will, entfernt diese Schrift (public/fonts/primae-*,
# die @font-face-Blöcke in src/index.css und den Eintrag in src/lib/typing/schriftart.ts).
[[annotations]]
path = "public/fonts/primae-*"
precedence = "override"
SPDX-FileCopyrightText = "Titus Nemeth, Martin Tiefenthaler; Wiener Bildungsserver"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

[[annotations]]
# Aufnahmen einzelner Töne von Instrumenten: University of Iowa, Electronic Music Studios (MIS), frei nutzbar.
[[annotations]]
path = "public/sounds/melodie/**"
precedence = "override"
SPDX-FileCopyrightText = "University of Iowa Electronic Music Studios (Musical Instrument Samples)"
SPDX-License-Identifier = "LicenseRef-Iowa-MIS"

# Klangproben von Klangpunkte: aus denselben Aufnahmen der University of Iowa abgeleitet.
[[annotations]]
path = "public/sounds/klangpunkte/**"
precedence = "override"
SPDX-FileCopyrightText = "University of Iowa Electronic Music Studios (Musical Instrument Samples)"
SPDX-License-Identifier = "LicenseRef-Iowa-MIS"

# liblouis: Übersetzung in Braille. Die WebAssembly-/asm.js-Fassung (Emscripten-Glue: MIT/NCSA) und alle
# Tabellen; die Tabellen tragen "GNU Lesser General Public License ... version 2.1 ... or (at your option)
# any later version" in ihren Kopfzeilen. Die Trennmuster *-patterns.dic sind aus den liblouis-Tabellen
# erzeugt (de-g1-core, de-g2-core) und gehören zu ihnen.
[[annotations]]
path = ["src/lib/braille/vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = "liblouis-Mitwirkende (siehe die Kopfzeilen der Tabellen)"
SPDX-License-Identifier = "LGPL-2.1-or-later"
